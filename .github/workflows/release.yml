name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "UMBRA_VERSION=${{ inputs.version }}" >> $env:GITHUB_ENV
          } else {
            "UMBRA_VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV
          }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version $env:UMBRA_VERSION
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umbra-${{ env.UMBRA_VERSION }}-windows-x64
          path: |
            artifacts/installer/*.exe
            artifacts/Umbra-Extension-*.zip
            artifacts/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/installer/*.exe `
            artifacts/Umbra-Extension-*.zip `
            artifacts/SHA256SUMS.txt `
            --title "Umbra $env:UMBRA_VERSION" `
            --generate-notes
